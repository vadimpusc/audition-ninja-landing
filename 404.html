<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <meta
      name="description"
      content="The page you were looking for could not be found on Audition Ninja."
    />
    <title>Page Not Found | Audition Ninja</title>
    <link rel="stylesheet" href="/styles.css" />

    <main class="page-shell">
      <section class="hero" aria-labelledby="page-title">
        <p class="eyebrow">Audition Ninja</p>
        <p class="error-code" aria-hidden="true">404</p>

          <p>
            The page you’re looking for may have moved, changed, or never made

          </p>

        <a class="button" href="/">Back to Audition Ninja</a>
        <a class="contact-link" href="mailto:info@auditionninja.com">
          Need help? Contact us
        </a>
      </section>
    </main>
